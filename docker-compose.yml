services:
  deaddrop:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - TRUST_PROXY=1
      - SQLITE_PATH=/app/backend/database/deaddrop.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - deaddrop_data:/app/backend/database
      - deaddrop_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  deaddrop_data:
  deaddrop_uploads:
